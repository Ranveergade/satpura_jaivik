databases:
  - name: satpura-jaivik-db
    plan: free
    databaseName: satpura_jaivik
    user: satpura

services:
  - type: web
    name: satpura-jaivik-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/accounts/csrf/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: satpura-jaivik-db
          property: connectionString
      # Set this to the final Vercel URL after the frontend is deployed.
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Use an SMTP provider that allows port 587 (for example Resend,
      # Brevo, Mailgun, or a Gmail app password). Required for login OTPs.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
